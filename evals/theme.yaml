# Golden examples for theme. A theme has no single right answer, so a model grader scores each one against a rubric.
# Code checks the rules that are true or false.
# Run: fnm exec --using=24 npx promptfoo@0.124.1 eval -c evals/theme.yaml
description: theme merges new material into the theme

prompts: ["{{material}}"]

providers:
  - id: file://providers.py:call_theme
    label: theme
    config:
      pythonExecutable: .venv/bin/python

defaultTest:
  options:
    # The grader for every llm-rubric check.
    provider:
      id: file://providers.py:call_grader
      config:
        pythonExecutable: .venv/bin/python
  assert:
    # 1 to 4 sentences.
    - type: javascript
      value: output.split(/[.!?](\s|$)/).filter(s => s.trim()).length <= 4
    # No audio terms.
    - type: javascript
      value: "!/reverb|delay|eq\\b|compress|bass|treble|mix|effect|dB|Hz/i.test(output)"

tests:
  - description: first theme keeps both feelings
    vars: {material: "walking through a favela at night. tense but alive"}
    assert:
      - type: llm-rubric
        value: The theme keeps both tension and aliveness. It mentions the favela at night.

  - description: new words win
    vars:
      current: "A quiet love song about missing someone far away. It feels sad."
      material: "actually it's not sad. it's hopeful because they're coming home"
    assert:
      - type: llm-rubric
        value: The theme is hopeful about someone coming home. It no longer says the song is sad.

  - description: nothing new keeps the theme
    vars:
      current: "A quiet love song about missing someone far away."
      material: "yeah like I said, it's about missing someone"
    assert:
      - type: llm-rubric
        value: "The theme means the same as: A quiet love song about missing someone far away. It adds nothing new."

  - description: no invented feelings
    vars: {material: "it's about driving home after a night shift"}
    assert:
      - type: llm-rubric
        value: The theme is about driving home after a night shift. It does not name a feeling the artist did not state, such as lonely or tired or peaceful.

  - description: mixed feelings stay mixed
    vars: {material: "sad but hopeful. like the morning after a breakup"}
    assert:
      - type: llm-rubric
        value: The theme keeps both sadness and hope. Neither one replaces the other.

  - description: audio words become feeling words
    vars: {material: "it should feel heavy like a huge reverb wash. like drowning"}
    assert:
      - type: llm-rubric
        value: The theme says the song feels heavy, like drowning. It describes the feeling and not the sound.
